    <script>
      // Apply the saved theme before the page paints, to avoid a flash.
      try {
        var t = localStorage.getItem('hh-theme');
        if (t === 'dark' || (!t && matchMedia('(prefers-color-scheme: dark)').matches)) {
          document.documentElement.classList.add('dark');
        }
      } catch (e) {}
    </script>
